# RentasHub local Supabase configuration.
# Local-only scaffold for ACCEL-P1-001. Do not add project_ref, linked remote
# configuration, or credential material.

project_id = "rentashub-local"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:4174"
additional_redirect_urls = ["http://127.0.0.1:4174"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[storage]
enabled = true
file_size_limit = "20MiB"

[edge_runtime]
enabled = false

[analytics]
enabled = false

[experimental]
orioledb_version = ""
