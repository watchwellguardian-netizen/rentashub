name: Auth Authorization Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-authorization-runtime-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  s5-s3f-auth-authorization:
    name: S5-S3F authentication and authorization validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OIDC_PROVIDER_MODE: mock
      LIVE_IDENTITY_PROVIDER_PENDING: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Guard against live identity provider mode
        run: |
          if [ "${OIDC_PROVIDER_MODE}" != "mock" ]; then
            echo "Refusing live identity provider mode for S5-S3F."
            exit 1
          fi

      - name: Run S5-S3F auth and authorization tests
        run: node --test tests/production/s5-s3f-auth-authorization-readiness.test.mjs

      - name: Generate S5-S3F machine-readable evidence
        run: |
          mkdir -p artifacts/runtime-evidence
          node scripts/s5-s3f-auth-authorization-readiness.mjs json > artifacts/runtime-evidence/auth-authorization-s5-s3f.json

      - name: Upload auth authorization runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-authorization-runtime-evidence
          path: artifacts/runtime-evidence/auth-authorization-s5-s3f.json
          retention-days: 14
