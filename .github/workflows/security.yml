name: Security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Audit server dependencies
        run: npm audit --prefix server --audit-level=high
        continue-on-error: true

  secret-pattern-scan:
    name: Secret pattern scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for blocked secret assignments
        shell: bash
        run: |
          if grep -RInE "(SUPABASE_SERVICE_ROLE_KEY|DATABASE_URL|JWT_SECRET|PAYMENT_SECRET_KEY|STRIPE_SECRET_KEY|SENTRY_DSN)\s*=\s*[^<[:space:]#]" \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=server/.data \
            --exclude='*.example' \
            .; then
            echo "Potential committed secret assignment detected."
            exit 1
          fi

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
