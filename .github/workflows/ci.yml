name: RentasHub CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test

      - name: Run backend scaffold tests
        run: npm run test:server

      - name: Generate credential readiness report
        run: npm run readiness

      - name: Build
        run: npm run build

      - name: Check deployable ZIP artifact contents
        run: npm run zip:check
