name: CI Gate Matrix

on:
  push:
    branches:
      - main
      - release
      - future-release-backlog
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: ${{ matrix.gate.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        gate:
          - name: frontend-tests
            command: npm run test
          - name: backend-tests
            command: npm run test:server
          - name: readiness
            command: npm run readiness
          - name: a4-supabase-readiness
            command: npm run a4:supabase
          - name: database-readiness
            command: npm run database:readiness
          - name: storage-readiness
            command: npm run storage:readiness
          - name: auth-rbac-readiness
            command: npm run auth-rbac:readiness
          - name: compliance-readiness
            command: npm run compliance:readiness
          - name: revenue-readiness
            command: npm run revenue:readiness
          - name: escrow-readiness
            command: npm run escrow:readiness
          - name: operational-readiness
            command: npm run operations:readiness
          - name: repository-release-readiness
            command: npm run release:readiness
          - name: secret-scan
            command: npm run security:scan
          - name: dependency-audit-plan
            command: npm run security:audit
          - name: artifact-validation
            command: npm run artifact:validate
          - name: zip-sanity
            command: npm run zip:check
          - name: production-build
            command: npm run build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.gate.name }}
        run: ${{ matrix.gate.command }}
