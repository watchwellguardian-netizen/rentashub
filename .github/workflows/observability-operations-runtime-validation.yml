name: Observability Operations Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-operations-runtime-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  s5-s3g-observability-operations:
    name: S5-S3G observability and operations validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OBSERVABILITY_MODE: local
      LIVE_TELEMETRY_DESTINATION_PENDING: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Guard against live telemetry mode
        run: |
          if [ "${OBSERVABILITY_MODE}" != "local" ]; then
            echo "Refusing live telemetry mode for S5-S3G."
            exit 1
          fi

      - name: Run S5-S3G observability and operations tests
        run: node --test tests/production/s5-s3g-observability-operations-readiness.test.mjs

      - name: Generate S5-S3G machine-readable evidence
        run: |
          mkdir -p artifacts/runtime-evidence
          node scripts/s5-s3g-observability-operations-readiness.mjs json > artifacts/runtime-evidence/observability-operations-s5-s3g.json

      - name: Upload observability operations runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-operations-runtime-evidence
          path: artifacts/runtime-evidence/observability-operations-s5-s3g.json
          retention-days: 14
