name: PostgreSQL Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-runtime-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pg006-runtime-validation:
    name: ACCEL-MICRO-PG-006 disposable PostgreSQL runtime validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rentashub_pg005_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rentashub_pg005_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ACCEL_PG005_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rentashub_pg005_test
      ACCEL_PG005_CONFIRM_DISPOSABLE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Prepare runtime evidence directory
        run: |
          mkdir -p artifacts/runtime-evidence
          printf '{"status":"STARTED","workflow":"postgres-runtime-validation","runtimeEvidenceGenerated":false}\n' > artifacts/runtime-evidence/postgres-pg006.json

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install project dependencies
        run: npm ci

      - name: Guard against production database targets
        run: |
          case "${ACCEL_PG005_DATABASE_URL}" in
            *supabase.co*|*supabase.com*)
              echo "Refusing hosted Supabase database target for PG-006."
              exit 1
              ;;
          esac

      - name: Verify runtime tools
        run: |
          node --version
          npm --version
          psql --version

      - name: Detect PG-005 harness readiness
        run: node scripts/accel-micro-pg-005-postgres-harness.mjs detect

      - name: Execute PG-006 runtime validation
        run: |
          mkdir -p artifacts/runtime-evidence
          node scripts/accel-micro-pg-005-postgres-harness.mjs run --json > artifacts/runtime-evidence/postgres-pg006.json

      - name: Upload PostgreSQL runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-rls-runtime-evidence
          path: artifacts/runtime-evidence/postgres-pg006.json
          retention-days: 14
