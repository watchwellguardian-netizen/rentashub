name: Object Storage Export Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: object-storage-export-runtime-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  s5-s3d-object-storage-validation:
    name: S5-S3D disposable object storage and export validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      s3mock:
        image: adobe/s3mock
        ports:
          - 9090:9090
    env:
      OBJECT_STORAGE_PROVIDER: s3
      OBJECT_STORAGE_ENDPOINT: http://localhost:9090
      OBJECT_STORAGE_BUCKET: rentashub-runtime-test
      OBJECT_STORAGE_CONFIRM_DISPOSABLE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Prepare runtime evidence directory
        run: |
          mkdir -p artifacts/runtime-evidence
          printf '{"status":"STARTED","workflow":"object-storage-export-runtime-validation","runtimeEvidenceGenerated":false}\n' > artifacts/runtime-evidence/object-storage-export-s5-s3d.json

      - name: Install project dependencies
        run: npm ci

      - name: Guard against production object-storage targets
        run: |
          case "${OBJECT_STORAGE_ENDPOINT}" in
            *amazonaws.com*|*cloudflarestorage.com*|*storage.googleapis.com*|*prod*|*production*)
              echo "Refusing production-like object-storage target for S5-S3D."
              exit 1
              ;;
          esac

      - name: Run S5-S3D focused tests
        run: node --test tests/production/s5-s3d-object-storage-export-readiness.test.mjs

      - name: Generate S5-S3D machine-readable evidence
        run: |
          mkdir -p artifacts/runtime-evidence
          node scripts/s5-s3d-object-storage-export-readiness.mjs json > artifacts/runtime-evidence/object-storage-export-s5-s3d.json

      - name: Upload object storage and export runtime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: object-storage-export-runtime-evidence
          path: artifacts/runtime-evidence/object-storage-export-s5-s3d.json
          retention-days: 14
