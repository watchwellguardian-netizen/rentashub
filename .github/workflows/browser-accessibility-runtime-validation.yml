name: Browser Accessibility Runtime Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-accessibility-runtime-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  s5-s3e-browser-accessibility:
    name: S5-S3E browser journey and accessibility validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4174
      VITE_AUTH_MODE: local
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Prepare runtime evidence directory
        run: |
          mkdir -p artifacts/runtime-evidence
          printf '{"status":"STARTED","workflow":"browser-accessibility-runtime-validation","runtimeEvidenceGenerated":false}\n' > artifacts/runtime-evidence/browser-accessibility-s5-s3e.json

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build app for browser validation
        run: npm run build

      - name: Guard against external browser targets
        run: |
          case "${PLAYWRIGHT_BASE_URL}" in
            http://127.0.0.1:*|http://localhost:*)
              echo "Browser validation target is local."
              ;;
            *)
              echo "Refusing non-local browser validation target for S5-S3E."
              exit 1
              ;;
          esac

      - name: Run S5-S3E browser and accessibility journeys
        run: npx playwright test

      - name: Generate S5-S3E machine-readable evidence
        if: always()
        run: |
          mkdir -p artifacts/runtime-evidence
          node scripts/s5-s3e-browser-accessibility-readiness.mjs json > artifacts/runtime-evidence/browser-accessibility-s5-s3e.json

      - name: Upload browser runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-accessibility-runtime-evidence
          path: |
            artifacts/runtime-evidence/browser-accessibility-s5-s3e.json
            artifacts/browser-results
            artifacts/browser-report
          retention-days: 14
